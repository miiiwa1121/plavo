# xcodegen の設定。.xcodeproj は生成物として扱い、この YAML を正とする。
# 生成: cd ios/PlavoApp && xcodegen generate

name: PlavoApp
options:
  bundleIdPrefix: dev.plavo
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

packages:
  PlavoCore:
    path: ../PlavoCore

targets:
  PlavoApp:
    type: application
    platform: iOS
    sources:
      - path: Sources
      # セリフとセンサーの再生データはアプリに同梱する（D34 / D36）。
      # リポジトリのファイルをフォルダ参照でそのまま入れ、二重管理を避ける。
      # type: folder にすると青いフォルダ参照になり、ディレクトリ構造ごとコピーされる。
      - path: ../../content/dialogues
        buildPhase: resources
        type: folder
      - path: ../../server/fixtures/sensors
        buildPhase: resources
        type: folder
      # 仕込みの株ひまりの一生分の計測値。育成のグラフに使う（D44）
      - path: ../../server/fixtures/growth
        buildPhase: resources
        type: folder
    dependencies:
      - package: PlavoCore
        product: PlavoCore
    info:
      path: Info.plist
      properties:
        CFBundleDisplayName: plavo
        UILaunchScreen: {}
        # 上下逆さまでも使えるようにする（C-1）。
        # 低い位置の植物を撮るときなど、端末を反転させることがある。
        # 横向きは含めない。吹き出しのレイアウトが縦持ち前提のため。
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        NSCameraUsageDescription: 植物を観察して、その気持ちを翻訳するためにカメラを使います
        # センサー中継サーバー（PC）から値を取得するため（D35）。
        # 会場のWi-Fiは使わず、スマホのテザリングで作ったローカルネットワークに繋ぐ。
        NSLocalNetworkUsageDescription: 土の湿りを測るセンサーの値を受け取るために、同じネットワーク上の機器と通信します
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        # 展示中に画面が消えないようにする
        UIRequiresFullScreen: true
